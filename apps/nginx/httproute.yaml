# Attaches to the shared Gateway in gateway-system (cross-namespace parentRef).
# Allowed because the Gateway listener sets allowedRoutes.namespaces.from: All.
#
# >>> Replace nginx.example.com with your real domain. <<<
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: default
  labels:
    app.kubernetes.io/name: nginx
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
      sectionName: http
      # When the HTTPS listener is enabled, add a second parentRef:
      # - name: public-gateway
      #   namespace: gateway-system
      #   sectionName: https
  hostnames:
    - nginx.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
